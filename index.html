<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
<title>슬라임의 기원 | Origin of Slime</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#c5eebc; }
  #game-frame { width:100vw; height:100vh; border:0; display:block; background:#c5eebc; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; font-weight:800; color:#3d3350; background:#c5eebc; z-index:10; }
</style>
</head>
<body>
<div id="boot">게임 불러오는 중...</div>
<iframe id="game-frame" allowfullscreen="true" allow="fullscreen; autoplay"></iframe>
<script>
'use strict';

const SOURCE_COMMIT = '6167e09180e6f8f6d82db28540bad6a7a833e6c2';
const SOURCE_BASE = `https://cdn.jsdelivr.net/gh/Gang-Gun/origin-of-slime-mobile@${SOURCE_COMMIT}/`;
const SOURCE_URL = SOURCE_BASE + 'index.html';

async function bootGame() {
  const boot = document.getElementById('boot');
  const frame = document.getElementById('game-frame');

  try {
    let html = await fetch(SOURCE_URL, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('source fetch failed: ' + r.status);
      return r.text();
    });

    html = html.replace('<head>', `<head>\n<base href="${SOURCE_BASE}">`);

    html = html.replace(
      '<span class="weather" id="weather-ico">☀️</span>',
      '<span class="weather" id="weather-ico">☀️</span>\n      <span class="clock" id="clock-text">낮</span>'
    );

    html = html.replace(
      "document.getElementById('clock-text').textContent = isNight ? '밤' : '낮';",
      "const clockEl = document.getElementById('clock-text'); if (clockEl) clockEl.textContent = isNight ? '밤' : '낮';"
    );

    frame.srcdoc = html;
    frame.addEventListener('load', () => { boot.style.display = 'none'; }, { once: true });
  } catch (err) {
    console.error(err);
    boot.textContent = '게임을 불러오지 못했습니다. 새로고침해 주세요.';
  }
}

bootGame();
</script>
</body>
</html>
